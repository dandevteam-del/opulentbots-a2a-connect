<!DOCTYPE html>
<html><body style="margin:0;padding:0;background:#f4f4f4;">
<!-- Example only. Replace with your own design: keep your HTML, and put {{field}} where text changes. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f4f4;"><tr><td align="center" style="padding:24px 12px;">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background:#ffffff;">
    <tr><td style="padding:32px 40px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:#222;">
      <p style="margin:0 0 16px;">Hi {{first_name}},</p>
      <p style="margin:0 0 16px;">{{message}}</p>
      <p style="margin:24px 0;"><a href="{{button_url}}" style="background:#1a1a1a;color:#fff;text-decoration:none;padding:12px 20px;border-radius:4px;display:inline-block;">{{button_text}}</a></p>
      <p style="margin:0;">{{signature}}</p>
    </td></tr>
  </table>
</td></tr></table>
</body></html>
